name: Review volunteer claim deadlines
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: replay-claim-expiry
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Review reservations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ vars.REPLAY_CLAIM_EXPIRY || 'preview' }}
        run: python3 tracker/claim_expiry.py --mode "$MODE"

  reconcile:
    # Writes made with GITHUB_TOKEN do not trigger the issue-closed workflow.
    # Reconcile even after a partial sweep. A queued normal reconciliation can
    # also pick up these releases if it replaces this pending job.
    needs: sweep
    if: always() && github.ref == 'refs/heads/main' && vars.REPLAY_CLAIM_EXPIRY == 'enforce'
    concurrency: replay-claim-ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Reconcile open reservations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPLAY_CLAIM_EXPIRY: ${{ vars.REPLAY_CLAIM_EXPIRY }}
        run: python3 tracker/grants.py --graphql
